name: miruum
description: "Miruum — Aplikasi Booking Hotel (OTA)."
publish_to: 'none'
version: 1.1.16+123

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  intl: ^0.19.0
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  permission_handler: ^12.0.3
  qr_flutter: ^4.1.0
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  share_plus: ^12.0.2
  geolocator: ^14.0.2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^9.0.1
  in_app_update: ^4.2.3   # Google Play native in-app update (auto-detects new releases)
  pdf: ^3.11.1
  printing: ^5.13.4
  barcode: ^2.2.8

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
