server {
    server_name miruum.id www.miruum.id;
    client_max_body_size 16m;
    location = /ota.apk { alias /var/www/ota/ota.apk; default_type application/vnd.android.package-archive; add_header Content-Disposition 'attachment; filename="miruum.apk"'; }
    location /api/ { proxy_pass http://127.0.0.1:5019; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 3600s; }
    location /storage/ { proxy_pass http://127.0.0.1:9002/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 3600s; }
    location / { proxy_pass http://127.0.0.1:8110; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 3600s; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/miruum.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miruum.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server { listen 80; server_name miruum.id www.miruum.id; return 301 https://$host$request_uri; }
