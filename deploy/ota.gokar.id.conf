# nginx host — reverse proxy Miruum OTA di VPS (ota.gokar.id).
#   /api      → backend core API           (127.0.0.1:5019)
#   /storage  → MinIO object storage        (127.0.0.1:9002) — public-read objects
#   /         → web portal (landing + BO + Extranet) (127.0.0.1:8101)
# TLS via certbot (--nginx).
server {
    listen 80;
    server_name ota.gokar.id;
    client_max_body_size 16m;

    # Unduh APK mobile (Flutter + Bloc).
    location = /ota.apk {
        alias /var/www/ota/ota.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="miruum.apk"';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # MinIO object storage (public-read bucket). Strips the /storage/ prefix.
    location /storage/ {
        proxy_pass http://127.0.0.1:9002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
