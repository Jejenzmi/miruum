server {
    server_name extranet.miruum.id;
    client_max_body_size 16m;
    location = / { return 302 /extranet; }
    location /api/ { proxy_pass http://127.0.0.1:5019; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 3600s; }
    location /storage/ { proxy_pass http://127.0.0.1:9002/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 3600s; }
    location / { proxy_pass http://127.0.0.1:8101; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 3600s; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.miruum.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.miruum.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = extranet.miruum.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name extranet.miruum.id;
    return 404; # managed by Certbot


}