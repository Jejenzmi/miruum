server {
    server_name email.miruum.id;
    root /var/lib/roundcube/public_html;
    index index.php;
    client_max_body_size 25m;

    location / { try_files $uri $uri/ /index.php; }
    location ~ /\.(?!well-known) { deny all; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/email.miruum.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/email.miruum.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = email.miruum.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name email.miruum.id;
    return 404; # managed by Certbot


}