# nginx host — reverse proxy Miruum di VPS (miruum.gokar.id).
#   /api → backend core API (127.0.0.1:5013)
#   /    → web portal: landing + Back Office + Extranet (127.0.0.1:8095)
# TLS via certbot (--nginx).
server {
    listen 80;
    server_name miruum.gokar.id;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:5013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
