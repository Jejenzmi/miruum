# nginx host — reverse proxy Miruum di VPS (miruum.gokar.id).
# Semua request → container web (127.0.0.1:8095); nginx di dalam container
# merutekan /api ke backend, sisanya SPA Flutter web. TLS via certbot (--nginx).
server {
    listen 80;
    server_name miruum.gokar.id;
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
